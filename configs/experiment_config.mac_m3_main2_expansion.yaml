project_root: .

dino:
  repo_path: ./third_party_dino_wm
  plan_config_name: plan_wall.yaml
  ckpt_base_path: /Users/anishpatnaik/Downloads
  model_name: wall_single
  model_epoch: latest

quantization:
  backend: fake_int8
  fallback_backend: fake_int8

variants:
  fp16:
    quantize_targets: []

  uniform_int8:
    quantize_targets: [encoder, predictor]
    quant_bits: 8
  mixed_int8:
    quantize_targets: [predictor]
    quant_bits: 8

  uniform_int6:
    quantize_targets: [encoder, predictor]
    quant_bits: 6
  mixed_int6:
    quantize_targets: [predictor]
    quant_bits: 6

  uniform_int4:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
  mixed_int4:
    quantize_targets: [predictor]
    quant_bits: 4

  uniform_int3:
    quantize_targets: [encoder, predictor]
    quant_bits: 3
  mixed_int3:
    quantize_targets: [predictor]
    quant_bits: 3

  # Encoder retention families at INT4 (predictor fixed INT4).
  encfp16_0:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
  encfp16_25:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
    encoder_exclude_paths:
      - base_model.blocks.9
      - base_model.blocks.10
      - base_model.blocks.11
  encfp16_50:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
    encoder_exclude_paths:
      - base_model.blocks.6
      - base_model.blocks.7
      - base_model.blocks.8
      - base_model.blocks.9
      - base_model.blocks.10
      - base_model.blocks.11
  encfp16_75:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
    encoder_exclude_paths:
      - base_model.blocks.3
      - base_model.blocks.4
      - base_model.blocks.5
      - base_model.blocks.6
      - base_model.blocks.7
      - base_model.blocks.8
      - base_model.blocks.9
      - base_model.blocks.10
      - base_model.blocks.11
  encfp16_100:
    quantize_targets: [predictor]
    quant_bits: 4

  # Head-preserved alternatives at same retained fraction.
  encheadfp16_25:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
    encoder_exclude_paths:
      - base_model.blocks.0
      - base_model.blocks.1
      - base_model.blocks.2
  encheadfp16_50:
    quantize_targets: [encoder, predictor]
    quant_bits: 4
    encoder_exclude_paths:
      - base_model.blocks.0
      - base_model.blocks.1
      - base_model.blocks.2
      - base_model.blocks.3
      - base_model.blocks.4
      - base_model.blocks.5

  # Asymmetric cross-allocation families.
  mixed_e8_p4:
    quantize_targets: [encoder, predictor]
    quant_bits_by_target:
      encoder: 8
      predictor: 4
  mixed_e4_p8:
    quantize_targets: [encoder, predictor]
    quant_bits_by_target:
      encoder: 4
      predictor: 8
  mixed_e6_p4:
    quantize_targets: [encoder, predictor]
    quant_bits_by_target:
      encoder: 6
      predictor: 4
  mixed_e4_p6:
    quantize_targets: [encoder, predictor]
    quant_bits_by_target:
      encoder: 4
      predictor: 6

evaluation:
  n_evals: 10
  seeds: [1, 2, 3]
  goal_source: file
  goal_H: 9
  planner_max_iter: 2
  render_videos: false
  goal_file_path_template: results/paired_targets/{run_name}/budget_{budget_id}/seed_{seed}/plan_targets.pkl

  budget_grid:
    - id: bA
      goal_H: 9
      opt_steps: 2
      planner_max_iter: 2
      seeds: [1, 2, 3]
      goal_source: file
    - id: bB
      goal_H: 12
      opt_steps: 3
      planner_max_iter: 3
      seeds: [1, 2, 3]
      goal_source: file
    - id: bC
      goal_H: 12
      opt_steps: 4
      planner_max_iter: 4
      seeds: [1, 2]
      goal_source: file
    - id: bA_rand
      goal_H: 9
      opt_steps: 2
      planner_max_iter: 2
      seeds: [1, 2, 3]
      goal_source: random_state
    - id: bB_rand
      goal_H: 12
      opt_steps: 3
      planner_max_iter: 3
      seeds: [1, 2, 3]
      goal_source: random_state

paired_targets:
  root: results/paired_targets
  generator_variant: fp16
  generator_opt_steps: 1

paths:
  variants_root: results/variants_m3_main2_expansion
  wall_root: results/wall_m3_main2_expansion
  figures_root: figures_m3_main2_expansion
  demo_artifacts_root: demo/demo_artifacts_m3_main2_expansion

sanity:
  n_evals: 1
  seed: 1
  opt_steps: 2

demo:
  reference_budget_id: bA
  reference_opt_steps: 2
  reference_seed: 1
  candidate_pool: 10
  episode_count: 4

labels:
  fp16: FP16
  uniform_int8: Uniform INT8
  mixed_int8: Mixed INT8 (enc FP16)
  uniform_int6: Uniform INT6
  mixed_int6: Mixed INT6 (enc FP16)
  uniform_int4: Uniform INT4
  mixed_int4: Mixed INT4 (enc FP16)
  uniform_int3: Uniform INT3
  mixed_int3: Mixed INT3 (enc FP16)
  encfp16_0: INT4 tail FP16 0%
  encfp16_25: INT4 tail FP16 25%
  encfp16_50: INT4 tail FP16 50%
  encfp16_75: INT4 tail FP16 75%
  encfp16_100: INT4 tail FP16 100%
  encheadfp16_25: INT4 head FP16 25%
  encheadfp16_50: INT4 head FP16 50%
  mixed_e8_p4: Mixed E8/P4
  mixed_e4_p8: Mixed E4/P8
  mixed_e6_p4: Mixed E6/P4
  mixed_e4_p6: Mixed E4/P6
