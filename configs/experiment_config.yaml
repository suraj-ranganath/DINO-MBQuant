project_root: .

dino:
  repo_path: ./third_party_dino_wm
  plan_config_name: plan_wall.yaml
  ckpt_base_path: /ABS/PATH/TO/checkpoints
  model_name: wall
  model_epoch: final

quantization:
  backend: bitsandbytes
  fallback_backend: fake_int8

variants:
  fp16:
    quantize_targets: []
  uniform_int8:
    quantize_targets: [encoder, predictor]
  mixed_int8:
    quantize_targets: [predictor]

evaluation:
  opt_steps: [30, 50]
  seeds: [0, 1]
  n_evals: 10
  goal_source: random_state
  goal_H: 5

paths:
  variants_root: results/variants
  wall_root: results/wall
  figures_root: figures
  demo_artifacts_root: demo/demo_artifacts

sanity:
  n_evals: 2
  seed: 0
  opt_steps: 30

demo:
  reference_opt_steps: 50
  reference_seed: 0
  candidate_pool: 30
  episode_count: 10

labels:
  fp16: FP16
  uniform_int8: Uniform INT8
  mixed_int8: Mixed INT8 (encoder FP16)
